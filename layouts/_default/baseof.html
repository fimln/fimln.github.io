<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {{ hugo.Generator }}
    <title>{{ .Title }} | {{ site.Title }}</title>
    <meta name="description" content="{{ site.Params.description }}">
    <link rel="canonical" href="{{ .Permalink }}">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_US">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:site_name" content="{{ site.Title }}">
    <meta property="og:title" content="{{ .Title }}">
    <meta property="og:description" content="{{ site.Params.description }}">
    <meta property="og:image" content="{{ "assets/img/logo.png" | absURL }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ .Title }}">
    <script type="application/ld+json">{{ dict "@context" "https://schema.org" "@type" "WebSite" "name" site.Title "headline" .Title "description" site.Params.description "url" site.BaseURL | jsonify | safeJS }}</script>
    <meta name="theme-color" content="#0b1220">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/x-icon" href="{{ "favicon.ico" | relURL }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ "favicon.png" | relURL }}">
    <link rel="apple-touch-icon" href="{{ "favicon.png" | relURL }}">
    <link rel="preload" href="{{ "assets/fonts/Inter-latin.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ "assets/css/style.css" | relURL }}?v={{ readFile "static/assets/css/style.css" | sha256 }}">
  </head>
  <body>
    <div class="layout">
      <header class="sidebar">
        <h1><a href="{{ "/" | relURL }}">{{ site.Title }}</a></h1>
        <img class="avatar" src="{{ "assets/img/logo.png" | relURL }}" alt="Logo">
        <p>{{ site.Params.description }}</p>
        <ul class="social-links">
          <li><a href="https://blog.alfi.ai.id/">Blog Page <strong>fimln Blog</strong></a></li>
          <li><a href="https://github.com/fimln">View On <strong>GitHub</strong></a></li>
          <li><a href="https://www.linkedin.com/in/fimln/">Lets Connect! <strong>LinkedIn</strong></a></li>
          <li><a href="https://www.instagram.com/alfimlnbr/">Follow me On <strong>Instagram</strong></a></li>
        </ul>
      </header>
      <main class="profile-card">
        {{ block "main" . }}{{ end }}
      </main>
      <footer class="site-footer">
        <p><small>Made with ❤️ and ☕, hosted on GitHub Pages</small></p>
      </footer>
    </div>
    <script>
      if (window.matchMedia('(pointer: fine)').matches) {
        const root = document.documentElement;
        window.addEventListener('pointermove', (e) => {
          root.style.setProperty('--mouse-x', e.clientX + 'px');
          root.style.setProperty('--mouse-y', e.clientY + 'px');
        }, { passive: true });
      }
    </script>
  </body>
</html>
